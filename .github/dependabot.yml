version: 2

updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 8
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
        dependency-type: production
        update-types: [minor, patch]
      react-ecosystem:
        patterns:
          - react
          - react-dom
          - react-hook-form
          - "@hookform/resolvers"
          - react-resizable-panels
        dependency-type: production
        update-types: [minor, patch]
      animation-and-ui-utilities:
        patterns:
          - framer-motion
          - gsap
          - tailwind-merge
        dependency-type: production
        update-types: [minor, patch]
      data-and-validation:
        patterns:
          - "@supabase/supabase-js"
          - date-fns
          - zod
        dependency-type: production
        update-types: [minor, patch]
      css-tooling:
        patterns:
          - autoprefixer
          - postcss
        dependency-type: development
        update-types: [minor, patch]
      lint-tooling:
        patterns:
          - "eslint-plugin-*"
          - typescript-eslint
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Singapore
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(actions)"
